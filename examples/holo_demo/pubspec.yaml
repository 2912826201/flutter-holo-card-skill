name: holo_card_playground
description: Adjustable holographic card demo with portable source exports.
publish_to: none
version: 1.0.0
environment:
  sdk: ^3.9.0
dependencies:
  flutter:
    sdk: flutter
  archive: 3.6.1
  web: 1.1.1
  build_flutter_holo_card_template:
    path: packages/build_flutter_holo_card_template
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
  - assets/export_payload.json
  - assets/holographic_card/height/
  - assets/holographic_card/medium/
  - assets/holographic_card/low/
