name: Demo Pages

on:
  push:
    branches: [main]
    paths:
      - 'examples/holo_demo/**'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: examples/holo_demo
      - run: flutter analyze && flutter test
        working-directory: examples/holo_demo
      - run: flutter build web --release --no-web-resources-cdn --base-href /flutter-holo-card-skill/
        working-directory: examples/holo_demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: examples/holo_demo/build/web
      - uses: actions/deploy-pages@v4
        id: deployment
